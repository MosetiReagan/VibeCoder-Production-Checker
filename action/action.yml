name: 'Production Check'
description: 'Scan a project for security, reliability, infrastructure, and production-readiness issues.'
branding:
  icon: 'shield'
  color: 'green'
inputs:
  path:
    description: 'Project directory to scan'
    required: false
    default: '.'
  fail-on:
    description: 'Minimum severity that fails the workflow'
    required: false
    default: 'high'
runs:
  using: 'docker'
  image: 'docker://ghcr.io/vibecoder/production-check:v1'
  args:
    - ${{ inputs.path }}
    - '--ci'
    - '--fail-on'
    - ${{ inputs.fail-on }}
